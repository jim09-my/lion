<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狮的家 - 醒狮陪伴</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #FFF8DC 0%, #F4A460 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景装饰 */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image:
                radial-gradient(circle at 20% 50%, #DC143C 2px, transparent 2px),
                radial-gradient(circle at 80% 50%, #DC143C 2px, transparent 2px);
            background-size: 100px 100px;
            z-index: -1;
        }

        /* 主容器 */
        .main-container {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding: 20px;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .kapok-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kapok-icon {
            width: 40px;
            height: 40px;
            background: url('resources/kapok_flower.png') no-repeat center;
            background-size: contain;
            transition: all 0.3s ease;
        }

        .kapok-icon.blooming {
            filter: brightness(1.3) saturate(1.5);
            transform: scale(1.1);
        }

        .intimacy-level {
            font-size: 14px;
            color: #2F4F2F;
            font-weight: 500;
        }

        /* 生菜图标样式 */
        .lettuce-icon {
            position: absolute;
            bottom: 50px;
            /* 调整位置，让它在醒狮下方一点 */
            right: 50px;
            /* 调整位置 */
            width: 60px;
            height: 60px;
            background: url('resources/lettuce.png') no-repeat center;
            background-size: contain;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            z-index: 5;
            /* 确保在醒狮之上，方便点击 */
            /* 添加 transform-origin，让它围绕底部中心缩放/旋转 */
            transform-origin: bottom center;
        }

        .lettuce-icon:hover {
            transform: scale(1.1);
        }

        /* 祝福卡片弹窗样式 (现在它是一个独立的弹窗) */
        .blessing-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            /* 更深的背景，突出卡片 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            /* 比喂食弹窗更高 */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }


        .daily-feed {
            background: linear-gradient(45deg, #FF6347, #FF8C69);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(255, 99, 71, 0.3);
        }

        .daily-feed:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 99, 71, 0.4);
        }

        .daily-feed:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* 醒狮容器 */
        .lion-container {
            position: relative;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .lion-character {
            width: 280px;
            height: 320px;
            background: url('resources/lion_smile.png') no-repeat center;
            background-size: contain;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .lion-character:hover {
            transform: scale(1.05) rotateY(5deg);
        }

        .lion-character.petting {
            animation: petting 0.5s ease-in-out;
        }

        @keyframes petting {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1) translateY(-5px);
            }
        }

        /* 触摸区域 */
        .touch-area {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .touch-area:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .head-area {
            width: 120px;
            height: 100px;
            top: 50px;
            left: 80px;
        }

        .back-area {
            width: 100px;
            height: 80px;
            top: 150px;
            left: 90px;
        }

        .chin-area {
            width: 80px;
            height: 60px;
            top: 180px;
            left: 100px;
        }

        .heart-particle {
            position: absolute;
            color: #FF69B4;
            font-size: 20px;
            pointer-events: none;
            animation: heartFloat 2s ease-out forwards;
        }

        @keyframes heartFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        /* 对话气泡 */
        .chat-bubble {
            position: absolute;
            top: -60px;
            right: -20px;
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #2F4F2F;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .chat-bubble.show {
            opacity: 1;
            transform: scale(1);
        }

        .chat-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
        }

        /* 功能按钮区域 */
        .function-buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }

        .function-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            min-width: 80px;
        }

        .function-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 1);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .chat-icon {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23DC143C"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>');
        }

        .diary-icon {
            background-image: url('resources/diary_book.png');
        }

        .memory-icon {
            background-image: url('resources/memory_book.png');
        }

        .btn-text {
            font-size: 12px;
            color: #2F4F2F;
            font-weight: 500;
        }

        /* 底部对话框 */
        .bottom-dialog {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .bottom-dialog:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        }

        .dialog-text {
            font-size: 14px;
            color: #2F4F2F;
            margin-bottom: 5px;
        }

        .dialog-hint {
            font-size: 12px;
            color: #888;
        }

        /* 喂食选择弹窗 */
        .feed-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .feed-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }

        .feed-title {
            font-size: 18px;
            color: #2F4F2F;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .silk-ball-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .silk-ball-option {
            background: linear-gradient(135deg, #FFF8DC, #F4A460);
            border: 2px solid #DC143C;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .silk-ball-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(220, 20, 60, 0.3);
        }

        .ball-name {
            font-size: 14px;
            color: #2F4F2F;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .ball-desc {
            font-size: 12px;
            color: #666;
        }

        .close-modal {
            background: #ccc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: #999;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .main-container {
                padding: 15px;
            }

            .lion-character {
                width: 250px;
                height: 280px;
            }

            .lion-container {
                height: 350px;
            }

            .function-buttons {
                gap: 10px;
            }

            .function-btn {
                min-width: 70px;
                padding: 12px;
            }
        }
    </style>
    <base target="_blank">
</head>

<body>
    <div class="bg-pattern"></div>

    <div class="main-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="kapok-status">
                <div class="kapok-icon" id="kapokIcon"></div>
                <div class="intimacy-level">亲密度: <span id="intimacyLevel">0</span></div>
            </div>
            <button class="daily-feed" id="dailyFeedBtn">每日喂食</button>
        </div>

        <!-- 醒狮角色 -->
        <div class="lion-container">
            <div class="lion-character" id="lionCharacter">
                <div class="touch-area head-area" data-area="head"></div>
                <div class="touch-area back-area" data-area="back"></div>
                <div class="touch-area chin-area" data-area="chin"></div>
                <div class="chat-bubble" id="chatBubble">想和我聊聊天吗？</div>
            </div>
            <div class="lettuce-icon" id="lettuceIcon"></div>
        </div>

        <!-- 功能按钮 -->
        <div class="function-buttons">
            <a href="chat.html" class="function-btn">
                <div class="btn-icon chat-icon"></div>
                <div class="btn-text">对话</div>
            </a>
            <a href="diary.html" class="function-btn">
                <div class="btn-icon diary-icon"></div>
                <div class="btn-text">日记</div>
            </a>
            <a href="memory.html" class="function-btn">
                <div class="btn-icon memory-icon"></div>
                <div class="btn-text">回忆</div>
            </a>
        </div>

        <!-- 底部对话框 -->
        <div class="bottom-dialog" onclick="window.location.href='chat.html'">
            <div class="dialog-text">今天过得怎么样？</div>
            <div class="dialog-hint">点击与我聊天 →</div>
        </div>
    </div>

    <!-- 喂食选择弹窗 -->
    <div class="feed-modal" id="feedModal">
        <div class="feed-content">
            <div class="feed-title">选择一个绣球喂给我吧</div>
            <div class="silk-ball-options">
                <div class="silk-ball-option" data-type="courage">
                    <div class="ball-name">勇气绣球</div>
                    <div class="ball-desc">给予你面对困难的勇气</div>
                </div>
                <div class="silk-ball-option" data-type="wisdom">
                    <div class="ball-name">智慧绣球</div>
                    <div class="ball-desc">帮助你做出明智的选择</div>
                </div>
                <div class="silk-ball-option" data-type="peace">
                    <div class="ball-name">平安绣球</div>
                    <div class="ball-desc">守护你的平安与健康</div>
                </div>
                <div class="silk-ball-option" data-type="happiness">
                    <div class="ball-name">快乐绣球</div>
                    <div class="ball-desc">带来欢乐与正能量</div>
                </div>
            </div>

        </div>

        <!-- 祝福卡片弹窗 -->
        <div class="blessing-modal" id="blessingModal">
            <div class="blessing-card">
                <div class="blessing-text" id="blessingText">步步高升</div>
                <div class="blessing-message" id="blessingMessage">愿你在人生的道路上步步高升，前程似锦！</div>
                <button class="blessing-close" onclick="closeBlessingModal()">收到祝福</button>
            </div>
        </div>
        <button class="close-modal" onclick="closeFeedModal()">取消</button>


        <script src="main.js"></script>
</body>

</html>
